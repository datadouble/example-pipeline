# Generated by `datadouble ci init` (Datadouble 0.0.2). Change the spec or
# the options and generate it again, rather than editing it by hand.
name: Datadouble shop-micro provision
on:
  pull_request:
    types:
      - opened
      - reopened
permissions:
  contents: read
concurrency:
  group: datadouble-shop-micro-provision-${{ github.event.pull_request.number || 'scheduled' }}
  cancel-in-progress: false
jobs:
  provision:
    name: provision
    runs-on:
      - self-hosted
      - staging
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: datadouble replicate
        uses: datadouble/datadouble/ci/github-actions@v0.0.2
        with:
          job: provision
          image: ghcr.io/datadouble/datadouble:v0.0.2
          user: 999:999
          mounts: |
            /var/tmp/example-pipeline/copies
            /var/tmp/example-pipeline/export
            /var/tmp/example-pipeline/staging
          arguments: |
            replicate
            --spec
            datadouble/shop-micro.yml
            --owner
            pr-${{ github.event.pull_request.number }}
