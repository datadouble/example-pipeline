# The demo, on every push and every night: the pipeline's workflows, run with
# act in a container that plays the self-hosted runner, as `make demo` does
# anywhere.
name: Demo

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    name: The whole pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the demo
        run: make demo
