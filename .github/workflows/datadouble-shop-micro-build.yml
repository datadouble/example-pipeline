# Generated by `datadouble ci init` (Datadouble 0.0.2). Change the spec or
# the options and generate it again, rather than editing it by hand.
name: Datadouble shop-micro build
on:
  schedule:
    - cron: 0 2 * * 1
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: datadouble-shop-micro-build
  cancel-in-progress: false
jobs:
  build:
    name: build
    runs-on:
      - self-hosted
      - prod-db
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: datadouble run
        uses: datadouble/datadouble/ci/github-actions@v0.0.2
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          SHOP_COSIGN_KEY: ${{ secrets.SHOP_COSIGN_KEY }}
          SHOP_SOURCE_DSN: ${{ secrets.SHOP_SOURCE_DSN }}
        with:
          job: build
          image: ghcr.io/datadouble/datadouble:v0.0.2
          user: 999:999
          mounts: |
            /var/tmp/example-pipeline/store
            /var/tmp/example-pipeline/work
          environment: |
            COSIGN_PASSWORD
            SHOP_COSIGN_KEY
            SHOP_SOURCE_DSN
          arguments: |
            run
            plan,extract,load,transform,package,verify,store
            --spec
            datadouble/shop-micro.yml
            --work
            /var/tmp/example-pipeline/work
            --retry-key
            ${{ github.run_id }}
