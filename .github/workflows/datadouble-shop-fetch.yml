name: Datadouble shop fetch
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: datadouble-shop-fetch
  cancel-in-progress: false
jobs:
  fetch:
    name: fetch
    runs-on:
      - self-hosted
      - staging
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: datadouble fetch
        uses: datadouble/datadouble/ci/github-actions@v0.0.0
        env:
          SHOP_COSIGN_PUB: ${{ secrets.SHOP_COSIGN_PUB }}
        with:
          job: fetch
          image: ghcr.io/datadouble/datadouble:v0.0.0
          user: 999:999
          mounts: |
            /var/tmp/example-pipeline/export
            /var/tmp/example-pipeline/staging
          environment: |
            SHOP_COSIGN_PUB
          arguments: |
            fetch
            --spec
            datadouble/shop.yml
