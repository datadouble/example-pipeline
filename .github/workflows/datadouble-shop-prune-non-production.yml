# Generated by `datadouble ci init` (Datadouble 0.0.0). Change the spec or
# the options and generate it again, rather than editing it by hand.
name: Datadouble shop prune-non-production
on:
  schedule:
    - cron: 0 4 * * *
  workflow_dispatch:
    inputs:
      dry-run:
        description: Report what would be removed, without removing it
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: datadouble-shop-prune-non-production
  cancel-in-progress: false
jobs:
  prune:
    name: prune
    runs-on:
      - self-hosted
      - staging
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: datadouble prune
        uses: datadouble/datadouble/ci/github-actions@v0.0.0
        with:
          job: prune
          image: ghcr.io/datadouble/datadouble:v0.0.0
          user: 999:999
          mounts: |
            /var/tmp/example-pipeline/copies
            /var/tmp/example-pipeline/export
            /var/tmp/example-pipeline/staging
          arguments: |
            prune
            --spec
            datadouble/shop.yml
            --target
            staging
            ${{ inputs.dry-run && '--dry-run' || '' }}
